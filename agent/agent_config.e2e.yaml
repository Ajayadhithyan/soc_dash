# E2E test config for the SOC Endpoint Detection Agent.

backend_url: http://127.0.0.1:8000
agent_token: e2e-test-agent-token-0001
agent_id: e2e-windows-01
hostname: "E2E-WIN-TEST"

collection_interval_seconds: 2

log_level: INFO
log_dir: agent_logs

queue:
  max_in_memory: 500
  max_spooled: 2000
  spool_path: data/e2e_spool.db

sender:
  batch_size: 50
  flush_interval_seconds: 2
  max_retries: 5
  backoff_base_seconds: 1
  backoff_max_seconds: 5
  timeout_seconds: 10
  verify_ssl: false

heartbeat:
  interval_seconds: 10

monitors:
  process: true
  network: false
  login: false
  file_integrity: false
  service: false
  registry: false
  usb: false
  dns: false