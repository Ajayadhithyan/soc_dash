services:
  mongodb:
    image: mongo:7
    container_name: soc-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - soc-mongodb-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: soc_ai_dashboard

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: soc-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      - mongodb
    environment:
      APP_ENV: production
      MONGODB_URI: mongodb://mongodb:27017/
      DB_NAME: soc_ai_dashboard
      OPENCODE_API_KEY: ${OPENCODE_API_KEY:-}
      EVENT_INTERVAL: "4"
      ENABLE_SYNTHETIC_GENERATOR: ${ENABLE_SYNTHETIC_GENERATOR:-false}
      DEMO_MODE: ${DEMO_MODE:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000,http://localhost:8080}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY before starting production services}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: soc-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  soc-mongodb-data:
